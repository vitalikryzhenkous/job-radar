[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar"
version = "0.1.0"
description = "Конвейер оценки вакансий: механика — скрипты, суждение — модель"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["jobradar"]

[tool.setuptools.package-data]
jobradar = ["dicts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
