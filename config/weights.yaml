# Веса баллов. Меняешь здесь — score.py пересчитает без правки кода.

fit:                      # соответствие, сумма 100
  role:                   # 30 максимум, по классу роли
    fde_applied_ai: 30
    fullstack_ai: 20
    fullstack: 10
    other: 0
  stack: 25
  level: 15
  must: 20
  lang_degree: 10

job:                      # вакансия, сумма 100; в балл идут только известные части
  money: 30               # против market.yaml
  contract: 20            # B2B, удалёнка или Познань гибрид
  company: 20             # компания и отзывы
  process: 10
  direct: 10              # прямой работодатель = 10, посредник с клиентом = 5, без клиента = 0
  hours: 10

# Риски: штраф и к какому баллу применяется (fit | job).
risks:
  intermediary_no_client: {penalty: -10, target: job}
  hours_after_18:         {penalty: -5,  target: job}   # не применять, если ставка >= рынка
  cs_degree_required:     {penalty: -5,  target: fit}
  python_5y_must:         {penalty: -10, target: fit}
  python_must:            {penalty: -5,  target: fit}   # Python обязателен, у профиля basic
  truncated:              {penalty: -5,  target: job}
  polish_c1_must:         {penalty: -10, target: fit}
  polish_c1_nice:         {penalty: 0,   target: fit}
  wrong_name:             {penalty: -5,  target: job}   # чужое имя = массовая рассылка
  onsite_other_city_1d:   {penalty: -5,  target: job}
  onsite_other_city_2d:   {penalty: -10, target: job}
  intermediary_chain:     {penalty: -5,  target: job}   # посредник подаёт в сервисную компанию, не конечному клиенту
  rtr_request:            {penalty: 0,   target: job}   # чек-лист перед подписью в score.pre_rtr
  submission_mismatch:    {penalty: 0,   target: job}   # submission расходится с профилем -> исправить до RTR

# Блокеры: балл 0, решение skip.
blockers:
  - us_only
  - foreign_residency
  - level_below_senior
  - java_banking_must
  - industrial_ml_must
  - phd_required
  - onsite_other_city_3d
  - admin_role                   # админ/эксплуатация вместо разработки
  - non_dev_role                 # аналитик, консультант, product owner, PM — не разработка
  - polish_above_max             # польский выше A2 (flags.POLISH_MAX) обязателен

decision:
  apply: {fit: 70, job: 60}      # оба порога -> apply
  skip_below: 50                 # оба < 50 -> skip
  job_skip_below: 40             # известный job < 40 -> skip; 40..apply.job при fit >= apply.fit -> clarify + low_rate
  research_min: 50               # исследование, если оба >= 50 и есть missing
  key_fields: [rate, contract, client, role, location]   # outreach без любого -> clarify
  # job = сумма известных частей / их максимум × 100; coverage = доля известных весов.
  # coverage < min_coverage -> job н/д, решение по fit (блокеры проверяются раньше):
  # fit >= apply.fit -> apply + call_notes (ставка, B2B, клиент); fit < skip_below -> skip; иначе clarify.
  # Outreach без ключевых полей -> clarify до этой проверки.
  min_coverage: 0.5

# Дорога вычитается из ставки перед сравнением с рынком (money), не штраф.
travel:
  other_city_trip_pln: 200       # одна поездка туда-обратно
  weeks_per_month: 4.33
