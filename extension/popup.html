<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  /* Минимализм, общий с картой (jobradar/poolmap.html): системный шрифт, тонкие серые линии, один акцент, решения — точки.
     Светлая/тёмная — как в системе. */
  :root { --bg: #fff; --ink: #18181b; --muted: #71717a; --line: #e4e4e7; --grid: #f4f4f5; --accent: #2563eb;
          --apply: #16a34a; --clarify: #d97706; --skip: #a1a1aa; --err: #dc2626; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f11; --ink: #f4f4f5; --muted: #a1a1aa; --line: #27272a; --grid: #18181b; --accent: #60a5fa;
            --apply: #22c55e; --clarify: #f59e0b; --skip: #52525b; --err: #ef4444; } }
  * { box-sizing: border-box; }
  body { margin: 0; width: 320px; padding: 16px; background: var(--bg); color: var(--ink);
         font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  header { display: flex; align-items: center; gap: 8px; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  header img { width: 18px; height: 18px; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  header span { margin-left: auto; color: var(--muted); font-size: 12px; }
  #msg { margin: 0 0 12px; min-height: 20px; }
  #msg.err { color: var(--err); }
  #stats { list-style: none; margin: 0 0 14px; padding: 0; border-top: 1px solid var(--line); }
  #stats li { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  #stats li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
  #stats .lbl { flex: 1; }
  #stats b { font-weight: 600; font-variant-numeric: tabular-nums; }
  #stats .apply { --c: var(--apply); } #stats .clarify { --c: var(--clarify); } #stats .skip { --c: var(--skip); }
  #stats .other { --c: var(--line); color: var(--muted); }
  #actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink);
           font: inherit; font-weight: 500; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.main { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: default; }
  #bar { height: 3px; margin: 0 0 12px; background: var(--grid); border-radius: 2px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }
  #bar.wait #fill { width: 30%; animation: scan 1.2s ease-in-out infinite; }
  @keyframes scan { from { margin-left: -30%; } to { margin-left: 100%; } }
</style></head>
<body>
  <header><img src="icons/icon32.png" alt=""><h1>Job Radar</h1><span>страница → оценка</span></header>
  <div id="msg">Ищу вакансии…</div>
  <div id="bar" hidden><div id="fill"></div></div>
  <ul id="stats" hidden></ul>
  <div id="actions"></div>
  <script src="popup.js"></script>
</body></html>
