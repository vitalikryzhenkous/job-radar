<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  /* 8-bit: палитра Game Boy, рамки «ступенькой» (box-shadow без скруглений), блочный прогресс, шрифт системный моноширинный */
  :root { --bg: #0f380f; --panel: #306230; --ink: #9bbc0f; --hi: #c8ec3c; --dim: #8bac0f; --blip: #ff5a3c; --px: 3px; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; width: 330px; background: var(--bg); color: var(--ink);
         font: bold 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; image-rendering: pixelated; }
  .px { box-shadow: 0 calc(-1 * var(--px)) 0 0 var(--dim), 0 var(--px) 0 0 var(--dim),
                    calc(-1 * var(--px)) 0 0 0 var(--dim), var(--px) 0 0 0 var(--dim); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  header img { width: 32px; height: 32px; image-rendering: pixelated; }
  h1 { margin: 0; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: var(--hi); }
  h1 small { display: block; font-size: 10px; letter-spacing: 1px; color: var(--dim); }
  #msg { background: var(--panel); padding: 10px; margin: 4px var(--px) 12px; min-height: 42px; }
  #msg.err { color: var(--blip); }
  #msg.err::before { content: "! "; }
  #msg.ok { color: var(--hi); }
  #msg.ok::before { content: "► "; }
  #actions { display: flex; gap: 12px; flex-wrap: wrap; padding: 0 var(--px); }
  button { padding: 7px 12px; border: 0; background: var(--ink); color: var(--bg); font: inherit; text-transform: uppercase;
           letter-spacing: 1px; cursor: pointer; box-shadow: 0 calc(-1 * var(--px)) 0 0 var(--hi), 0 var(--px) 0 0 #0a250a,
           calc(-1 * var(--px)) 0 0 0 var(--hi), var(--px) 0 0 0 #0a250a; }
  button:hover { background: var(--hi); }
  button:active { transform: translateY(var(--px)); }
  button:disabled { opacity: .5; cursor: default; transform: none; }
  button.sec { background: var(--panel); color: var(--ink); }
  /* прогресс из блоков: заливка шагами по 10px, пустые клетки видны сеткой */
  #bar { height: 16px; margin: 0 var(--px) 12px; background: var(--panel); padding: 3px; }
  #fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--hi) 0 7px, transparent 7px 10px);
          transition: width .3s steps(4); }
  #bar.wait #fill { width: 30%; animation: scan 1.2s steps(12) infinite; }
  @keyframes scan { from { margin-left: 0; } to { margin-left: 70%; } }
  .blink { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style></head>
<body>
  <header><img src="icons/icon32.png" alt=""><h1>Job Radar<small>вакансии со страницы → оценка</small></h1></header>
  <div id="msg" class="px">Ищу вакансии<span class="blink">_</span></div>
  <div id="bar" class="px" hidden><div id="fill"></div></div>
  <div id="actions"></div>
  <script src="popup.js"></script>
</body></html>
