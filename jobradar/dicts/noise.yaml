# Строки-шум LinkedIn и писем (regex, без учёта регистра, вся строка).
lines:
  - "Подать заявку"
  - "Простая подача заявки"
  - "Сохранить"
  - "Показать все"
  - "Люди, с которыми вы можете связаться"
  - "Бывшие сотрудники компании .*"
  - "Продвигается нанимающей компанией.*"
  - "\\d+ из \\d+ соответствий навыков"
  - "Об этой вакансии"
  - "Easy Apply|Apply|Save|Show all|About the job"
  - "\\d+ (applicants|кандидат\\w*)"
# Хвосты строк: вырезаются, остальное остаётся (локация до точки).
tails:
  - "\\s*·\\s*\\d+\\s+(час\\w*|дн\\w*|день|недел\\w*|минут\\w*|hours?|days?|weeks?)\\s+(назад|ago).*$"
